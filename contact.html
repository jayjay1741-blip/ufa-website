<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFA — Contact</title>
<meta name="description" content="UFA一級建築士事務所へのお問い合わせ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;">

  <div class="nav-outer">
    <div class="wrap nav-inner">
      <a href="index.html" style="display:flex;align-items:center;"><img src="assets/logo.png" style="height:22px;width:auto;display:block;" alt="UFA"></a>
      <div class="navlinks">
        <a class="navlink" href="about.html">About</a>
        <a class="navlink" href="works.html">Works</a>
        <a class="navlink" href="news.html">News</a>
        <a class="navlink on" href="contact.html">Contact</a>
        <a class="ig-link" href="https://www.instagram.com/ufa_umekawa_fuse/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg></a>
      </div>
    </div>
  </div>

  <div class="wrap" style="max-width:min(94vw,760px);padding:64px 32px 100px;display:flex;flex-direction:column;gap:26px;">
    <form id="contact-form" style="display:flex;flex-direction:column;gap:20px;">
      <div class="field" style="display:flex;flex-direction:column;gap:7px;">
        <label for="f-name">NAME</label>
        <input id="f-name" type="text" placeholder="お名前">
      </div>
      <div class="field" style="display:flex;flex-direction:column;gap:7px;">
        <label for="f-email">EMAIL</label>
        <input id="f-email" type="email" placeholder="メールアドレス">
      </div>
      <div class="field" style="display:flex;flex-direction:column;gap:7px;">
        <label for="f-message">MESSAGE</label>
        <textarea id="f-message" rows="5" placeholder="お問い合わせ内容をご記入ください"></textarea>
      </div>
      <label style="display:flex;align-items:center;gap:9px;font-family:'Noto Sans JP',sans-serif;font-size:12.5px;color:var(--muted);">
        <input id="f-agree" type="checkbox" style="width:15px;height:15px;">
        プライバシーポリシーに同意します
      </label>
      <button id="f-send" type="button" class="btn" style="background:var(--ink);color:#fff;border:none;padding:14px;border-radius:2px;cursor:pointer;">SEND</button>
    </form>
  </div>

  <div class="footer-outer">
    <div class="wrap footer-inner">
      <p class="footer-copy">© UFA</p>
    </div>
  </div>

</div>

<script>
document.getElementById('f-send').addEventListener('click', function () {
  var name = document.getElementById('f-name').value;
  var email = document.getElementById('f-email').value;
  var message = document.getElementById('f-message').value;
  var subject = encodeURIComponent('お問い合わせ（' + (name || 'お名前未記入') + '様より）');
  var body = encodeURIComponent(
    'お名前: ' + name + '\n' +
    '返信先メールアドレス: ' + email + '\n\n' +
    message
  );
  window.location.href = 'mailto:fuse@ufa-arc.jp,umekawa@ufa-arc.jp?subject=' + subject + '&body=' + body;
});
</script>
</body>
</html>
